name: Deploy

on:
  workflow_call:
    secrets:
      EC2_HOST:
        required: true
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy na EC2 (SSM)
    if: github.ref == 'refs/heads/main'

    concurrency:
      group: deploy-producao
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      INSTANCIA: ${{ vars.EC2_INSTANCE_ID }}

      SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SHA }}

      - name: Conferir configuração
        env:
          TEM_CHAVE: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
          TEM_SEGREDO: ${{ secrets.AWS_SECRET_ACCESS_KEY != '' }}
          REGIAO: ${{ vars.AWS_REGION }}
        run: |
          faltando=""
          [ "$TEM_CHAVE" != "true" ] && faltando="$faltando AWS_ACCESS_KEY_ID(secret)"
          [ "$TEM_SEGREDO" != "true" ] && faltando="$faltando AWS_SECRET_ACCESS_KEY(secret)"
          [ -z "$REGIAO" ] && faltando="$faltando AWS_REGION(variable)"
          [ -z "$INSTANCIA" ] && faltando="$faltando EC2_INSTANCE_ID(variable)"
          [ -z "$EC2_HOST" ] && faltando="$faltando EC2_HOST(secret)"
          if [ -n "$faltando" ]; then
            echo "::error::Configure em Settings > Secrets and variables > Actions:$faltando"
            exit 1
          fi

      - name: Credenciais da AWS (usuário de deploy, privilégio mínimo)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Conferir se a EC2 está ligada e conectada ao SSM
        run: |
          estado=$(aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=$INSTANCIA" \
            --query "InstanceInformationList[0].PingStatus" --output text)
          echo "SSM: $estado"
          if [ "$estado" != "Online" ]; then
            echo "::error::A EC2 não está online no SSM (status: $estado). Ela está pausada? Ligue a EC2 e rode de novo em Actions > Deploy > Run workflow."
            exit 1
          fi

      - name: Deploy (roda deploy/deploy.sh na EC2 pelo SSM)
        run: |
          set -euo pipefail
          script=$(base64 -w0 deploy/deploy.sh)

          jq -n --arg script "$script" --arg sha "$SHA" '{
            executionTimeout: ["1200"],
            commands: [
              "set -eu",
              "echo \($script) | base64 -d > /tmp/dlink-deploy.sh",
              "chmod 644 /tmp/dlink-deploy.sh",
              "sudo -iu ubuntu bash /tmp/dlink-deploy.sh \($sha)"
            ]
          }' > parametros.json

          comando=$(aws ssm send-command \
            --instance-ids "$INSTANCIA" \
            --document-name AWS-RunShellScript \
            --comment "deploy dlink ${SHA::7}" \
            --parameters file://parametros.json \
            --timeout-seconds 120 \
            --query Command.CommandId --output text)
          echo "Comando SSM: $comando"

          # Acompanha até terminar (até 20 min, o mesmo executionTimeout acima)
          status=Pending
          for _ in $(seq 1 120); do
            sleep 10
            status=$(aws ssm get-command-invocation --command-id "$comando" --instance-id "$INSTANCIA" \
              --query Status --output text 2> /dev/null || echo Pending)
            case "$status" in
              Pending | InProgress | Delayed) echo "... $status" ;;
              *) break ;;
            esac
          done

          echo "::group::Saída do deploy.sh"
          aws ssm get-command-invocation --command-id "$comando" --instance-id "$INSTANCIA" \
            --query StandardOutputContent --output text || true
          echo "::endgroup::"
          echo "::group::Erros do deploy.sh"
          aws ssm get-command-invocation --command-id "$comando" --instance-id "$INSTANCIA" \
            --query StandardErrorContent --output text || true
          echo "::endgroup::"

          echo "Status final: $status"
          if [ "$status" != "Success" ]; then
            echo "::error::O deploy na EC2 terminou com status $status (veja a saída acima)."
            exit 1
          fi

      - name: Conferir o site
        run: |
          curl -fsS --retry 5 --retry-delay 3 "https://$EC2_HOST/api/health"
          echo
          curl -fsS -o /dev/null "https://$EC2_HOST/"
          echo "Site e API respondendo."

      - name: Resumo
        if: ${{ success() }}
        run: |
          {
            echo "### Deploy concluído (SSM)"
            echo "- Commit: \`${SHA::7}\`"
            echo "- https://$EC2_HOST"
          } >> "$GITHUB_STEP_SUMMARY"
