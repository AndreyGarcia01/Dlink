# CI do D-Link: qualidade (lint, tipos, testes com cobertura, build) e análise no
# SonarCloud (só quando o segredo SONAR_TOKEN existir). O deploy (CD) vai ficar num workflow separado (deploy.yml).
#
# Metas de cobertura (README): 75% no backend e 25% no frontend. Elas estão no
# vitest.config.ts; se a cobertura cair abaixo disso, o passo de testes falha.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Se chegar um push novo na mesma branch/PR, cancela a execução antiga.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      # Gera os tipos do Prisma a partir do schema. Não precisa de banco.
      - name: Prisma Client
        run: npx prisma generate

      - name: Lint (ESLint)
        run: npm run lint

      - name: Checagem de tipos (frontend e backend)
        run: npm run typecheck

      # Os testes não usam banco nem .env de verdade: o Prisma é mockado e o
      # JWT_SECRET de teste está no vitest.config.ts.
      - name: Testes com cobertura
        run: npm run test:coverage

      - name: Build do frontend
        run: npm run build

      - name: Guardar relatório de cobertura
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cobertura
          path: coverage/
          retention-days: 7

  sonarcloud:
    name: SonarCloud
    needs: qualidade
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Avisar se o SONAR_TOKEN não está configurado
        if: ${{ env.SONAR_TOKEN == '' }}
        run: echo "::notice::SONAR_TOKEN não configurado; análise do SonarCloud pulada."

      - name: Checkout
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # o Sonar usa o histórico para saber o que é código novo

      - name: Baixar relatório de cobertura
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cobertura
          path: coverage/

      - name: Análise no SonarCloud
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
