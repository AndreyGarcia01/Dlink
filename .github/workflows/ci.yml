# CI/CD do D-Link: qualidade (lint, tipos, testes com cobertura, build), análise
# no SonarCloud (quando o segredo SONAR_TOKEN existe) e, em push na main com a
# qualidade aprovada, o deploy na EC2 (workflow reutilizável deploy.yml).
#
# Metas de cobertura (README): 75% no backend e 25% no frontend. Elas estão no
# vitest.config.ts; se a cobertura cair abaixo disso, o passo de testes falha.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Em PR, um push novo cancela a execução antiga. Na main não cancela, para
# nunca interromper um deploy no meio (ex.: durante uma migration).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  qualidade:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        # --ignore-scripts: não roda scripts de instalação de pacotes de terceiros
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Gera os tipos do Prisma a partir do schema. Não precisa de banco.
      - name: Prisma Client
        run: npm run db:generate

      - name: Lint (ESLint)
        run: npm run lint

      - name: Checagem de tipos (frontend e backend)
        run: npm run typecheck

      # Os testes não usam banco nem .env de verdade: o Prisma é mockado e o
      # JWT_SECRET de teste está no vitest.config.ts.
      - name: Testes com cobertura
        run: npm run test:coverage

      - name: Build do frontend
        run: npm run build

      - name: Guardar relatório de cobertura
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cobertura
          path: coverage/
          retention-days: 7

  sonarcloud:
    name: SonarCloud
    needs: qualidade
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Avisar se o SONAR_TOKEN não está configurado
        if: ${{ env.SONAR_TOKEN == '' }}
        run: echo "::notice::SONAR_TOKEN não configurado; análise do SonarCloud pulada."

      - name: Checkout
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # o Sonar usa o histórico para saber o que é código novo

      - name: Baixar relatório de cobertura
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cobertura
          path: coverage/

      - name: Análise no SonarCloud
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0

  deploy:
    name: Deploy na EC2
    needs: qualidade
    # Só publica o que entrou na main (nunca PR nem outras branches)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
