# Configuração do SonarCloud. Troque os dois valores abaixo pelos do seu projeto
# no sonarcloud.io (aparecem em Information, dentro do projeto).
sonar.organization=andreygarcia01
sonar.projectKey=AndreyGarcia01_Dlink

sonar.sources=Server,src
sonar.tests=Server,src
sonar.test.inclusions=**/__tests__/**,**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/__tests__/**,**/*.test.ts,**/*.test.tsx,src/test/**

# Mesmas exclusões de cobertura do vitest.config.ts
sonar.coverage.exclusions=src/main.tsx,src/types/**,src/vite-env.d.ts,Server/index.ts,Server/lib/prisma.ts,src/test/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
